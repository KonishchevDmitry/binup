[package]
name = "binup"
version = "2.1.1"
description = "Automated app installation from GitHub releases"
keywords = ["github-releases", "installer", "package-manager", "prebuilt-binaries", "releases"]
categories = ["command-line-utilities"]

authors = ["Dmitry Konishchev <konishchev@gmail.com>"]
repository = "https://github.com/KonishchevDmitry/binup"
documentation = "https://github.com/KonishchevDmitry/binup"
license = "GPL-3.0+"
readme = "README.md"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true

[lints.clippy]
type_complexity = "allow"

[dependencies]
ansi_term = "0.12.1"
bzip2 = "0.6.1"
chrono = "0.4.45"
clap = "4.6.7"
const_format = "0.2.37"
easy-logging = "1"
file-format = { version = "0.29.0", features = ["reader"] }
flate2 = "1.1"
futures-util = "0.3.34"
globset = "0.4.21"
http = "1.5.0"
indoc = "2.0.8"
is-terminal = "0.4.17"
itertools = "0.15.0"
octocrab = { version = "0.54.9", features = ["stream"] }
libc = "0.2.191"
log = "0.4.35"
nondestructive = "0.0.29"
platforms = "4.3.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
rustls = { version = "0.23.46" }
semver = "1.0.28"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_yaml = "0.9.34"
shellexpand = "3.1.2"
strum = "0.28"
strum_macros = "0.28"
tabled = { version = "0.22.0", features = ["ansi"] }
tar = "0.4.46"
tempfile = "3.27.0"
textwrap = "0.16.4"
tokio = "1"
url = "2.5.8"
validator = { version = "0.21.0", features = ["derive"] }
xz2 = "0.1.7"
zip = "9.6.0"

# Force static linking
lzma-sys = { version = "0.1", features = ["static"] }

[dev-dependencies]
assert_matches = "1.5.0"
indoc = "2.0.8"
rstest = "0.28.0"
test-log = "0.2.21"
